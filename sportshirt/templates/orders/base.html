{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Makita{% endblock %}</title>

<!-- นำเข้า Tailwind CSS ผ่าน Official Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- นำเข้าฟอนต์ Noto Sans Thai -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html {
    overflow-x: hidden;
  }
  body {
    font-family: 'Noto Sans Thai', sans-serif;
    background-color: #05030d;
    background-image:
      linear-gradient(180deg, rgba(5,3,13,0.72) 0%, rgba(9,4,24,0.85) 45%, rgba(5,3,13,0.95) 100%),
      url("{% static 'orders/img/nebula-bg.jpg' %}");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* บนมือถือ background-attachment:fixed อาจกระตุกและกินพื้นที่การ scroll ผิดปกติ
     จึงเปลี่ยนเป็น scroll แทนเมื่อหน้าจอแคบ */
  @media (max-width: 767px) {
    body {
      background-attachment: scroll;
    }
  }

  /* กรอบเรืองแสงนีออนสีม่วง สำหรับการ์ด/กล่องสำคัญ */
  .neon-card {
    background: rgba(15, 10, 35, 0.65);
    border: 1px solid rgba(192, 90, 255, 0.45);
    box-shadow:
      0 0 18px 1px rgba(192, 90, 255, 0.35),
      0 0 45px -8px rgba(139, 46, 227, 0.55),
      inset 0 0 25px -12px rgba(192, 90, 255, 0.35);
    backdrop-filter: blur(6px);
  }

  .neon-text {
    text-shadow: 0 0 8px rgba(217, 130, 255, 0.85), 0 0 18px rgba(147, 51, 234, 0.6);
  }

  .neon-divider {
    background: linear-gradient(90deg, transparent, rgba(192, 90, 255, 0.8), transparent);
    height: 1px;
  }
</style>
</head>
<body class="min-h-screen">
  <nav class="border-b border-purple-500/30 bg-black/30 backdrop-blur-sm">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <span class="text-lg font-extrabold tracking-wide text-fuchsia-300 neon-text">Makita</span>
    </div>
  </nav>
  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
